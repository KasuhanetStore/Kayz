<!-- KASUHANET HEADER TEMPLATE B: PRIVACY POLICY NAVIGATION -->
<style>
.kn-template-header{position:sticky;top:0;z-index:100;background:rgba(8,9,13,.92);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.12)}
.kn-template-header .container{width:min(1120px,calc(100% - 36px));margin:0 auto}
.kn-template-header .nav{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:20px;position:relative}
.kn-template-header .brand{display:inline-flex;align-items:center;text-decoration:none;line-height:1}
.kn-template-header .brand-logo{display:block;width:auto;height:auto;max-width:180px;max-height:60px;object-fit:contain;object-position:left center}
.kn-template-header .nav-links{display:flex;align-items:center;justify-content:flex-end;gap:24px;flex-wrap:nowrap;color:#d8dbe4;font:14px Inter,Arial,Helvetica,sans-serif}
.kn-template-header .nav-links a{color:inherit;text-decoration:none;transition:color .18s ease,background-color .18s ease,border-color .18s ease}
.kn-template-header .nav-links a:hover,.kn-template-header .nav-links a[aria-current=page]{color:#ff667d}
.kn-template-header .nav-lang{display:flex;gap:8px;margin:4px 0}
.kn-template-header .nav-lang a{display:inline-flex;align-items:center;justify-content:center;padding:9px 13px;border:1px solid rgba(255,255,255,.2);border-radius:9px;color:#fff;background:rgba(255,255,255,.03);font-size:12px;font-weight:800}
.kn-template-header .nav-lang a:hover{border-color:#ff304f}
.kn-template-header .btn-cyber-animated{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border:1px solid rgba(255,113,135,.55);border-radius:10px;color:#fff!important;background:linear-gradient(120deg,#a90025,#ff304f,#ff7a35);font-size:13px;font-weight:900;white-space:nowrap}
.kn-template-header .menu-toggle{display:none;background:transparent;border:1px solid rgba(255,255,255,.2);color:#f6f7fb;font-size:20px;padding:8px 12px;border-radius:8px;cursor:pointer}
.kn-template-header .dropdown{position:relative}
.kn-template-header .dropdown>a{cursor:pointer}
.kn-template-header .dropdown-content{display:none;position:absolute;top:100%;left:0;min-width:190px;padding:8px;background:#10131c;border:1px solid rgba(255,255,255,.14);border-radius:10px;box-shadow:0 14px 30px rgba(0,0,0,.45)}
.kn-template-header .dropdown-content.show{display:block}
.kn-template-header .dropdown-content a{display:block;padding:9px 10px;border-radius:7px;white-space:nowrap}
.kn-template-header .dropdown-content a:hover{background:rgba(255,48,79,.12)}
@media(max-width:850px){
 .kn-template-header .nav{min-height:70px;padding:10px 0;gap:12px}
 .kn-template-header .menu-toggle{display:inline-flex;align-items:center;justify-content:center}
 .kn-template-header .nav-links{display:none;position:absolute;top:70px;left:calc((min(1120px,100vw - 36px) - 100vw)/2);width:100vw;box-sizing:border-box;flex-direction:column;align-items:stretch;gap:14px;padding:20px 24px;background:rgba(8,9,13,.98);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.12);box-shadow:0 15px 30px rgba(0,0,0,.6)}
 .kn-template-header .nav-links.active{display:flex}
 .kn-template-header .nav-links>a:not(.btn-cyber-animated),.kn-template-header .nav-links>.dropdown{display:block;width:100%;padding:7px 0}
 .kn-template-header .nav-lang{width:100%}
 .kn-template-header .nav-lang a{flex:1}
 .kn-template-header .btn-cyber-animated{width:100%;box-sizing:border-box}
 .kn-template-header .dropdown-content{position:static;width:100%;box-sizing:border-box;margin-top:7px}
}
@media(max-width:420px){.kn-template-header .container{width:calc(100% - 28px)}.kn-template-header .brand-logo{max-width:160px;max-height:56px}}
</style>
<header class="kn-template-header">
 <div class="container nav">
  <a class="brand" href="/" aria-label="KasuhaNET Official Page"><img src="/img/logo3.png" class="brand-logo" alt="KasuhaNET.STORE"></a>
  <nav class="nav-links" id="knPolicyTemplateNav" aria-label="Main Navigation">
   <a href="/">HOME</a>
   <a href="/About-Us/">ABOUT US</a>
   <a href="/guides/">GUIDES</a>
   <a href="/Privacy-Policy/" aria-current="page">PRIVACY POLICY</a>
   <a href="/Support/">SUPPORT</a>
   <div class="nav-lang"><a href="/Privacy-Policy/" lang="en" aria-current="page">EN</a><a href="/Privacy-Policy/MS/" lang="ms">BM</a></div>
   <a class="btn-cyber-animated" href="/Banner-WebSale-EN.html"><span>GET WEBSITE!</span><i class="fa-solid fa-computer-mouse" aria-hidden="true"></i></a>
  </nav>
  <button class="menu-toggle" type="button" aria-label="Toggle Navigation" aria-controls="knPolicyTemplateNav" aria-expanded="false" onclick="const n=document.getElementById('knPolicyTemplateNav');const s=n.classList.toggle('active');this.setAttribute('aria-expanded',s?'true':'false')"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
 </div>
</header>
