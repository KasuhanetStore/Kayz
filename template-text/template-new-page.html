    <style>
      :root {
        --bg: #08090d;
        --panel: #12141c;
        --panel-2: #191b25;
        --text: #f6f7fb;
        --muted: #b9bdca;
        --red: #ff304f;
        --red-dark: #a90025;
        --orange: #ff7a35;
        --line: rgba(255,255,255,.12);
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        background: radial-gradient(circle at 80% 0%, rgba(255,48,79,.14), transparent 30%), var(--bg);
        color: var(--text);
        font-family: Inter, Arial, Helvetica, sans-serif;
        line-height: 1.6;
      }
      a { color: inherit; text-decoration: none; }
      .container { width: min(1120px, calc(100% - 36px)); margin: 0 auto; }
      
      .topbar {
        position: sticky; top: 0; z-index: 10;
        background: rgba(8,9,13,.88); backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--line);
      }
      .nav { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
      .brand { display: flex; align-items: center; gap: 11px; font-weight: 900; letter-spacing: .5px; }
      .brand-mark {
        width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px;
        background: linear-gradient(135deg, var(--red), #ff814a); color: white; font-weight: 1000;
        box-shadow: 0 0 28px rgba(255,48,79,.28);
      }
      .brand small { display: block; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: 2px; }
      .nav-links { display: flex; align-items: center; gap: 24px; color: #d8dbe4; font-size: 14px; }
      .nav-links a:hover { color: #ff667d; }
      
      .btn {
        display: inline-flex; justify-content: center; align-items: center; gap: 8px;
        padding: 12px 18px; border-radius: 10px; border: 1px solid transparent;
        font-weight: 800; font-size: 14px; cursor: pointer; transition: .2s ease;
      }
      .btn-primary { background: linear-gradient(120deg, var(--red-dark), var(--red), var(--orange)); color: white; box-shadow: 0 8px 28px rgba(255,48,79,.2); }
      .btn-primary:hover { transform: translateY(-2px); filter: brightness(1.1); }
      .btn-outline { border-color: rgba(255,255,255,.2); color: white; background: rgba(255,255,255,.03); }
      .btn-outline:hover { border-color: var(--red); }

      .hero { padding: 68px 0 38px; text-align: center; }
      .eyebrow { display: inline-flex; align-items: center; gap: 8px; color: #ff8b9c; font-size: 12px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; }
      .eyebrow::before { content: ""; width: 25px; height: 2px; background: linear-gradient(90deg,var(--red),var(--orange)); }
      h1 { font-size: clamp(34px, 4.5vw, 56px); line-height: 1.1; letter-spacing: -1.5px; margin: 12px 0 18px; font-family: Inter, Arial, Helvetica, sans-serif; }
      .gradient-text { background: linear-gradient(100deg,#fff 0%,#ff7187 48%,#ff9b52 100%); color: transparent; background-clip: text; -webkit-background-clip: text; }
      
      .section { padding: 48px 0; }
      .section-head { text-align: center; max-width: 780px; margin: 0 auto 36px; }
      .section-head h2 { font-size: clamp(26px,3.8vw,40px); line-height: 1.15; margin: 12px 0; }
      .section-head p { color: var(--muted); margin: 0; font-size: 15px; }

      .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
      .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
      
      .card {
        background: linear-gradient(145deg, var(--panel-2), var(--panel));
        border: 1px solid var(--line);
        border-radius: 17px;
        padding: 24px;
        transition: border-color .2s ease;
      }
      .card:hover { border-color: rgba(255,48,79,.4); }
      .card h3 { margin: 0 0 10px; font-size: 18px; color: #fff; }
      .card p { color: var(--muted); font-size: 14px; margin: 0; }

      .about-intro-box {
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 28px;
        background: linear-gradient(145deg, rgba(255,48,79,.08), rgba(255,255,255,.025));
        font-size: 16px;
        color: #d8dbe4;
        line-height: 1.75;
        margin-bottom: 24px;
      }

      /* Partner Credit Bar CSS */
      .partner-credit-bar {
          background-color: var(--bg);
          border-top: 1px solid var(--line);
          border-bottom: 1px solid var(--line);
          padding: 22px 15px;
          text-align: center;
          font-family: Inter, Arial, Helvetica, sans-serif;
          color: var(--text);
          box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.9);
          width: 100%;
      }
      .credit-text {
          font-size: 0.72rem;
          letter-spacing: 2px;
          text-transform: uppercase;
          color: var(--muted);
          margin-bottom: 14px;
          font-weight: 400;
      }
      .partner-logos {
          display: flex;
          justify-content: center;
          align-items: center;
          gap: 16px;
          flex-wrap: wrap;
      }
      .partner-name {
          color: #00f3ff;
          font-size: 0.92rem;
          font-weight: 700;
          letter-spacing: 1px;
          text-shadow: 0 0 10px rgba(0, 243, 255, 0.65), 0 0 20px rgba(0, 243, 255, 0.2);
      }
      .partner-logo-box {
          width: 34px;
          height: 34px;
          display: flex;
          align-items: center;
          justify-content: center;
          border: 1px solid var(--red);
          border-radius: 4px;
          background-color: #0c0e15;
          box-shadow: 0 0 12px rgba(255, 48, 79, 0.45);
          padding: 2px;
      }
      .partner-logo-box img {
          max-width: 100%;
          max-height: 100%;
          object-fit: contain;
          display: block;
      }

      /* Dropdown Menu */
      .dropdown { position: relative; display: inline-block; }
      .dropdown-content {
          display: none; position: absolute; right: 0; background-color: var(--panel-2);
          min-width: 220px; box-shadow: 0px 10px 30px rgba(0,0,0,0.5); border: 1px solid var(--line);
          border-radius: 12px; z-index: 100; overflow: hidden; margin-top: 10px;
      }
      .dropdown-content a {
          color: var(--text) !important; padding: 12px 16px; text-decoration: none; display: block;
          font-size: 13px; border-bottom: 1px solid rgba(255,255,255,.05); transition: background .2s;
      }
      .dropdown-content a:last-child { border-bottom: none; }
      .dropdown-content a:hover { background: rgba(255,48,79,.15); color: #ff7187 !important; }
      .show { display: block; }

      footer { border-top: 1px solid var(--line); margin-top: 30px; padding: 28px 0; color: #aeb2c0; font-size: 12px; }
      .footer-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
      
      .whatsapp-float {
        position: fixed; right: 20px; bottom: 20px; z-index: 30; width: 60px; height: 60px; border-radius: 50%;
        display: grid; place-items: center; color: #fff; background: linear-gradient(135deg,#25d366,#0b9d58);
        box-shadow: 0 10px 30px rgba(37,211,102,.35); border: 2px solid rgba(255,255,255,.85); transition: transform .2s;
      }
      .whatsapp-float:hover { transform: translateY(-4px) scale(1.04); }
      .whatsapp-float svg { width: 30px; height: 30px; fill: currentColor; }

      @media(max-width:850px){
        .grid-3, .grid-2 { grid-template-columns: 1fr; }
        .nav-links a:not(.btn):not(.dropdown) { display: none; }
      }
      @media(max-width:580px){
        .container { width: min(100% - 28px, 1120px); }
        .nav { min-height: 66px; }
        .hero { padding: 42px 0 24px; }
        .whatsapp-float { width: 56px; height: 56px; right: 15px; bottom: 15px; }
      }
    </style>
</head>
