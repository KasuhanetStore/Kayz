<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article Collection</title>
    <style>
        /* Base Page Styles */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1.page-title {
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e50;
        }

        /* Article Grid Layout */
        .article-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        /* Article Card Styles */
        .article-card {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease-in-out;
        }

        .article-card:hover {
            transform: translateY(-5px);
        }

        .article-card h2 {
            font-size: 1.25rem;
            margin-top: 0;
            margin-bottom: 10px;
            color: #1a252f;
        }

        .article-card p {
            font-size: 0.95rem;
            color: #666;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .article-card a.read-btn {
            display: inline-block;
            text-align: center;
            background-color: #007bff;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .article-card a.read-btn:hover {
            background-color: #0056b3;
        }
    </style>
<link rel="stylesheet" href="css/style.css">

</head>
<body>

    <div class="container">
        <!-- Page Title -->
        <h1 class="page-title">Article Collection</h1>

        <!-- Article Card Grid -->
        <div class="article-grid">
            <article class="article-card">
                <h2>Knowledge Centre</h2>
                <p>The article collection is now maintained in the KasuhaNET Knowledge Centre, with practical technical guides and reference material.</p>
                <a href="/guides/" class="read-btn">Visit Knowledge Centre</a>
            </article>
        </div>
    </div>
    </div>
