<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Pengurusan Tempahan | KasuhaNET</title>
<style>
:root{color-scheme:dark;--bg:#080b12;--panel:#121927;--line:#263448;--text:#edf3fb;--muted:#9eacc0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#2a1728 0,transparent 32%),var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}main{width:min(1180px,calc(100% - 28px));margin:34px auto}h1{margin:0;font-size:clamp(26px,4vw,38px)}p{color:var(--muted)}.top,.toolbar,.actions{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.panel{background:rgba(18,25,39,.92);border:1px solid var(--line);border-radius:16px;padding:18px;margin:18px 0}input,select,textarea,button{font:inherit;border-radius:9px;border:1px solid var(--line);padding:10px 12px;background:#0b1220;color:var(--text)}button{cursor:pointer;background:#a92843;border-color:#d94c67;font-weight:700}button:disabled{opacity:.5;cursor:wait}.toolbar input{min-width:220px;flex:1}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:820px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.status{display:inline-block;padding:3px 8px;border-radius:20px;background:#253348;font-size:12px}.demo{color:#ffc66d;font-size:11px}.muted{color:var(--muted)}.error{color:#ff9aaa}.success{color:#a7f3c0}.row-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.row-actions select{max-width:150px}.log-list{display:grid;gap:10px}.log{padding:12px;border:1px solid var(--line);border-radius:10px}
</style></head><body><main>
<div class="top"><div><p>KASUHANET · ADMIN</p><h1>Pengurusan Tempahan</h1><p>Rekod disimpan dalam Cloudflare D1. Perubahan status mempunyai sejarah audit.</p></div><button id="refresh">Muat semula</button></div><div id="notice" class="panel">Memuatkan data…</div>
<section class="panel"><div class="toolbar"><input id="search" placeholder="Cari ID, nama, e-mel atau telefon"><input id="adminNote" placeholder="Catatan admin untuk kemas kini status"><select id="filter"><option value="">Semua status</option><option>Pending</option><option>Confirmed</option><option>In Progress</option><option>Completed</option><option>Cancelled</option></select></div><div class="table-wrap"><table><thead><tr><th>Tempahan</th><th>Pelanggan</th><th>Pakej</th><th>Harga</th><th>Status</th><th>Kemaskini / Sejarah</th></tr></thead><tbody id="orders"><tr><td colspan="6">Memuatkan…</td></tr></tbody></table></div></section>
<section class="panel"><h2>Log penyelenggaraan</h2><form id="maintenanceForm" class="toolbar"><input name="title" placeholder="Tajuk aktiviti" required maxlength="160"><select name="activity_type"><option>Backup</option><option>Security</option><option>Bug Fix</option><option>Update</option><option>Monitoring</option><option>Other</option></select><select name="status"><option>Completed</option><option>Planned</option><option>In Progress</option><option>Blocked</option></select><input name="description" placeholder="Penerangan ringkas"><button>Simpan log</button></form><div id="logs" class="log-list muted">Memuatkan log…</div></section></main>
<script>
const $=s=>document.querySelector(s),statuses=["Pending","Confirmed","In Progress","Completed","Cancelled"];
const notice=(m,k="")=>{$("#notice").className="panel "+k;$("#notice").textContent=m};
const money=c=>new Intl.NumberFormat("ms-MY",{style:"currency",currency:"MYR"}).format((c||0)/100);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(url,options={}){const r=await fetch(url,{...options,headers:{"Content-Type":"application/json",...(options.headers||{})},cache:"no-store"});const d=await r.json().catch(()=>({error:"Respons server tidak sah."}));if(!r.ok)throw Error(d.error||"Permintaan gagal.");return d}
async function loadOrders(){try{const p=new URLSearchParams();if($("#filter").value)p.set("status",$("#filter").value);if($("#search").value.trim())p.set("q",$("#search").value.trim());const d=await api("/api/admin/orders?"+p);$("#orders").innerHTML=d.orders.length?d.orders.map(o=>`<tr><td><strong>${esc(o.id)}</strong><br><small class="muted">${new Date(o.created_at).toLocaleString()}</small>${o.is_demo?'<br><span class="demo">SAMPLE / DEMO</span>':""}</td><td>${esc(o.customer_name)}<br><small>${esc(o.customer_email)}<br>${esc(o.customer_phone)}</small></td><td>${esc(o.package_name)}<br><small class="muted">${esc(o.customer_note)}</small></td><td>${money(o.amount_cents)}</td><td><span class="status">${esc(o.status)}</span><br><small class="muted">${esc(o.admin_note)}</small></td><td><div class="row-actions"><select data-status="${esc(o.id)}">${statuses.map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select><button data-save="${esc(o.id)}">Simpan</button><button data-history="${esc(o.id)}">Sejarah</button></div></td></tr>`).join(""):'<tr><td colspan="6">Tiada tempahan ditemui.</td></tr>';notice(d.orders.length+" tempahan dimuatkan.","success")}catch(e){notice(e.message+" Semak tetapan Cloudflare Access, ADMIN_EMAILS dan D1.","error")}}
async function loadLogs(){try{const d=await api("/api/admin/maintenance");$("#logs").innerHTML=d.logs.length?d.logs.map(l=>`<div class="log"><strong>${esc(l.title)}</strong> · ${esc(l.activity_type)} <span class="status">${esc(l.status)}</span>${l.is_demo?'<span class="demo"> SAMPLE</span>':""}<br>${esc(l.description)}<br><small class="muted">${new Date(l.performed_at).toLocaleString()} · ${esc(l.performed_by)}</small></div>`).join(""):"Tiada log penyelenggaraan."}catch(e){$("#logs").textContent=e.message}}
async function refresh(){await Promise.all([loadOrders(),loadLogs()])}
$("#orders").addEventListener("click",async e=>{
 const id=e.target.dataset.save||e.target.dataset.history;if(!id)return;
 const button=e.target;button.disabled=true;
 try{
  if(e.target.dataset.history){const d=await api("/api/admin/order-history?id="+encodeURIComponent(id));notice(d.history.length?d.history.map(h=>(h.old_status||"New")+" → "+h.new_status+" | "+h.admin_email+" | "+new Date(h.changed_at).toLocaleString()+" | "+h.note).join("\\n"):"Tiada sejarah status.","success");return;}
  const select=document.querySelector('[data-status="'+CSS.escape(id)+'"]');
  await api("/api/admin/orders",{method:"PATCH",body:JSON.stringify({id,status:select.value,note:$("#adminNote").value.trim()})});$("#adminNote").value="";await loadOrders();
 }catch(err){notice(err.message,"error")}finally{button.disabled=false}
});
$("#refresh").addEventListener("click",refresh);$("#filter").addEventListener("change",loadOrders);let timer;$("#search").addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(loadOrders,250)});
$("#maintenanceForm").addEventListener("submit",async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{await api("/api/admin/maintenance",{method:"POST",body:JSON.stringify(Object.fromEntries(new FormData(e.currentTarget)))});e.currentTarget.reset();await loadLogs();notice("Log penyelenggaraan disimpan.","success")}catch(err){notice(err.message,"error")}finally{b.disabled=false}});refresh();
</script></body></html>
