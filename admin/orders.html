<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Pengurusan Tempahan | KasuhaNET</title>
<style>
:root{color-scheme:dark;--bg:#080b12;--panel:#121927;--line:#263448;--text:#edf3fb;--muted:#9eacc0;--accent:#ff536d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#2a1728 0,transparent 32%),var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}
main{width:min(1180px,calc(100% - 28px));margin:34px auto}h1{margin:0;font-size:clamp(26px,4vw,38px)}p{color:var(--muted)}.top,.toolbar,.actions{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.panel{background:rgba(18,25,39,.92);border:1px solid var(--line);border-radius:16px;padding:18px;margin:18px 0}
input,select,textarea,button{font:inherit;border-radius:9px;border:1px solid var(--line);padding:10px 12px;background:#0b1220;color:var(--text)}button{cursor:pointer;background:#a92843;border-color:#d94c67;font-weight:700}button:disabled{opacity:.5;cursor:wait}
.toolbar input{min-width:220px;flex:1}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:820px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.status{display:inline-block;padding:3px 8px;border-radius:20px;background:#253348;font-size:12px}.demo{color:#ffc66d;font-size:11px}.muted{color:var(--muted)}.error{color:#ff9aaa}.success{color:#a7f3c0}.hidden{display:none}.row-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.row-actions select{max-width:150px}.log-list{display:grid;gap:10px}.log{padding:12px;border:1px solid var(--line);border-radius:10px}.log small{color:var(--muted)}
</style>
</head>
<body>
<main>
  <div class="top"><div><p>KASUHANET · ADMIN</p><h1>Pengurusan Tempahan</h1><p>Data dipaparkan daripada Cloudflare D1. Perubahan status direkodkan dalam sejarah audit.</p></div><button id="refresh">Muat semula</button></div>
  <div id="notice" class="panel">Memuatkan data…</div>
  <section class="panel">
    <div class="toolbar"><input id="search" placeholder="Cari ID, nama, e-mel atau telefon"><select id="filter"><option value="">Semua status</option><option>Pending</option><option>Confirmed</option><option>In Progress</option><option>Completed</option><option>Cancelled</option></select></div>
    <div class="table-wrap"><table><thead><tr><th>Tempahan</th><th>Pelanggan</th><th>Pakej</th><th>Harga</th><th>Status</th><th>Kemaskini</th></tr></thead><tbody id="orders"><tr><td colspan="6">Memuatkan…</td></tr></tbody></table></div>
  </section>
  <section class="panel"><h2>Log penyelenggaraan</h2><form id="maintenanceForm" class="toolbar"><input name="title" placeholder="Tajuk aktiviti" required maxlength="160"><select name="activity_type"><option>Backup</option><option>Security</option><option>Bug Fix</option><option>Update</option><option>Monitoring</option><option>Other</option></select><select name="status"><option>Completed</option><option>Planned</option><option>In Progress</option><option>Blocked</option></select><input name="description" placeholder="Penerangan ringkas"><button>Simpan log</button></form><div id="logs" class="log-list muted">Memuatkan log…</div></section>
</main>
<script>
const $=s=>document.querySelector(s), statuses=["Pending","Confirmed","In Progress","Completed","Cancelled"];
const notice=(message,kind="")=>{$("#notice").className="panel "+kind;$("#notice").textContent=message};
const money=cents=>new Intl.NumberFormat("ms-MY",{style:"currency",currency:"MYR"}).format((cents||0)/100);
async function api(url,options={}){const response=await fetch(url,{...options,headers:{"Content-Type":"application/json",...(options.headers||{})},cache:"no-store"});const data=await response.json().catch(()=>({error:"Respons server tidak sah."}));if(!response.ok)throw new Error(data.error||"Permintaan gagal.");return data}
function esc(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function loadOrders(){try{const params=new URLSearchParams();if($("#filter").value)params.set("status",$("#filter").value);if($("#search").value.trim())params.set("q",$("#search").value.trim());const data=await api("/api/admin/orders?"+params);$("#orders").innerHTML=data.orders.length?data.orders.map(o=>`<tr><td><strong>${esc(o.id)}</strong><br><small class="muted">${new Date(o.created_at).toLocaleString()}</small>${o.is_demo?'<br><span class="demo">SAMPLE / DEMO</span>':""}</td><td>${esc(o.customer_name)}<br><small>${esc(o.customer_email)}<br>${esc(o.customer_phone)}</small></td><td>${esc(o.package_name)}<br><small class="muted">${esc(o.customer_note)}</small></td><td>${money(o.amount_cents)}</td><td><span class="status">${esc(o.status)}</span><br><small class="muted">${esc(o.admin_note)}</small></td><td><div class="row-actions"><select data-status="${esc(o.id)}">${statuses.map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select><button data-save="${esc(o.id)}">Simpan</button></div></td></tr>`).join(""):'<tr><td colspan="6">Tiada tempahan ditemui.</td></tr>';notice(data.orders.length+" tempahan dimuatkan.","success")}catch(e){notice(e.message+" Pastikan Cloudflare Access dan D1 telah dikonfigurasi.","error")}}
async function loadLogs(){try{const data=await api("/api/admin/maintenance");$("#logs").innerHTML=data.logs.length?data.logs.map(l=>`<div class="log"><strong>${esc(l.title)}</strong> · ${esc(l.activity_type)} <span class="status">${esc(l.status)}</span>${l.is_demo?'<span class="demo"> SAMPLE</span>':""}<br>${esc(l.description)}<br><small>${new Date(l.performed_at).toLocaleString()} · ${esc(l.performed_by)}</small></div>`).join(""):"Tiada log penyelenggaraan."}catch(e){$("#logs").textContent=e.message}}
async function refresh(){await Promise.all([loadOrders(),loadLogs()])}
$("#orders").addEventListener("click",async e=>{const id=e.target.dataset.save;if(!id)return;const select=document.querySelector('[data-status="'+CSS.escape(id)+'"]');const button=e.target;button.disabled=true;try{await api("/api/admin/orders",{method:"PATCH",body:JSON.stringify({id,status:select.value,note:"Updated from admin dashboard"})});await loadOrders()}catch(err){notice(err.message,"error")}finally{button.disabled=false}});
$("#refresh").addEventListener("click",refresh);$("#filter").addEventListener("change",loadOrders);
let searchTimer;$("#search").addEventListener("input",()=>{clearTimeout(searchTimer);searchTimer=setTimeout(loadOrders,250)});
$("#maintenanceForm").addEventListener("submit",async e=>{e.preventDefault();const button=e.submitter;button.disabled=true;const form=new FormData(e.currentTarget);try{await api("/api/admin/maintenance",{method:"POST",body:JSON.stringify(Object.fromEntries(form))});e.currentTarget.reset();await loadLogs();notice("Log penyelenggaraan disimpan.","success")}catch(err){notice(err.message,"error")}finally{button.disabled=false}});
refresh();
</script>
</body>
</html>
