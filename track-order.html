<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Semak Tempahan | KasuhaNET</title>
<style>:root{color-scheme:dark;--bg:#080b12;--panel:#121927;--line:#263448;--text:#edf3fb;--muted:#9eacc0}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 80% 0,#2a1728 0,transparent 32%),var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}.card{width:min(560px,100%);padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:18px}h1{margin:0 0 8px}p,.muted{color:var(--muted)}label{display:block;margin:14px 0 5px}input,button{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:#0b1220;color:var(--text);font:inherit}button{margin-top:18px;background:#a92843;border-color:#d94c67;font-weight:700;cursor:pointer}.result{margin-top:18px}.item{padding:12px 0;border-bottom:1px solid var(--line)}.status{display:inline-block;padding:4px 10px;background:#26364b;border-radius:30px}.error{color:#ff9aaa}</style></head><body><main class="card"><p>KASUHANET · CUSTOMER</p><h1>Semak status tempahan</h1><p>Masukkan ID tempahan dan token rahsia yang diberikan selepas borang dihantar. Token ini ialah kunci akses kepada rekod anda.</p><form id="lookup"><label for="orderId">ID tempahan</label><input id="orderId" required maxlength="40" autocomplete="off"><label for="token">Token semakan</label><input id="token" required maxlength="100" autocomplete="off"><button id="submit">Semak tempahan</button></form><div id="result" class="result" aria-live="polite"></div></main>
<script>
const $=s=>document.querySelector(s),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
$("#lookup").addEventListener("submit",async e=>{e.preventDefault();const b=$("#submit"),out=$("#result");b.disabled=true;b.textContent="Sedang menyemak…";out.textContent="";try{const p=new URLSearchParams({id:$("#orderId").value.trim(),token:$("#token").value.trim()}),r=await fetch("/api/orders?"+p,{cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(d.error||"Rekod tidak ditemui.");const o=d.order;out.innerHTML='<div class="item"><strong>'+esc(o.id)+'</strong><br>'+esc(o.package_name)+' · RM '+(o.amount_cents/100).toFixed(2)+'<br>Status: <span class="status">'+esc(o.status)+'</span></div><div class="item">Dicipta: '+new Date(o.created_at).toLocaleString()+'</div><div class="item">Dikemas kini: '+new Date(o.updated_at).toLocaleString()+'</div><h2>Sejarah status</h2>'+d.history.map(h=>'<div class="item">'+esc(h.old_status||"Baharu")+' → <strong>'+esc(h.new_status)+'</strong><br><span class="muted">'+new Date(h.changed_at).toLocaleString()+' · '+esc(h.note)+'</span></div>').join("")}catch(err){out.innerHTML='<p class="error">'+esc(err.message)+'</p>'}finally{b.disabled=false;b.textContent="Semak tempahan"}});
</script></body></html>
