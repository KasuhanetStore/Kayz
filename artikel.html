    <title>Koleksi Artikel</title>
    <style>
        /* Gaya Asas Halaman */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1.tajuk-halaman {
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e50;
        }

        /* Susunan Grid Kad Artikel */
        .artikel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        /* Gaya Kad Artikel */
        .artikel-card {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease-in-out;
        }

        .artikel-card:hover {
            transform: translateY(-5px);
        }

        .artikel-card h2 {
            font-size: 1.25rem;
            margin-top: 0;
            margin-bottom: 10px;
            color: #1a252f;
        }

        .artikel-card p {
            font-size: 0.95rem;
            color: #666;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .artikel-card a.btn-baca {
            display: inline-block;
            text-align: center;
            background-color: #007bff;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .artikel-card a.btn-baca:hover {
            background-color: #0056b3;
        }
    </style>
